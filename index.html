<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Participios irregulares</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Caveat:wght@600&family=Onest:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column, a single notebook-page card in the middle, ink-coloured answers written into the blank. */
:root{
  --paper:#f3f1f8; --sheet:#fdfcff; --rule:#d6dcf0; --ink:#262338; --muted:#6c6883;
  --pen:#c2187a; --cover:#1f9e8f; --ok:#16806f; --bad:#b3372b; --line:#dedbea;
  --display:"Bricolage Grotesque","Onest",system-ui,sans-serif;
  --body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --hand:"Caveat","Segoe Print","Bradley Hand",cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#17151f; --sheet:#211e2c; --rule:#2f2c40; --ink:#ece9f6; --muted:#9d98b5;
  --pen:#ff6fb8; --cover:#3fc4b3; --ok:#56d3bf; --bad:#ff8e80; --line:#35314a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#17151f; --sheet:#211e2c; --rule:#2f2c40; --ink:#ece9f6; --muted:#9d98b5;
  --pen:#ff6fb8; --cover:#3fc4b3; --ok:#56d3bf; --bad:#ff8e80; --line:#35314a; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:28px 48px}
.wrap{max-width:560px;margin-inline:auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-direction:column;gap:4px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(1.6rem,6vw,2.1rem);line-height:1.1;margin:0;text-wrap:balance}
header p{margin:0;color:var(--muted);font-size:.95rem}

.progress{display:flex;align-items:center;gap:12px;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--cover);transition:width .3s}

.card{background:var(--sheet);border:1px solid var(--line);border-bottom:6px solid var(--cover);border-radius:6px;
  padding:24px 20px 22px;display:flex;flex-direction:column;gap:16px;
  background-image:repeating-linear-gradient(to bottom,transparent 0 35px,var(--rule) 35px 36px);background-position:0 12px}
.verb{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.verb b{font-family:var(--display);font-weight:700;color:var(--ink);letter-spacing:0;text-transform:none;font-size:1.05rem;margin-left:6px}
.sentence{font-family:var(--display);font-weight:500;font-size:clamp(1.3rem,5.4vw,1.7rem);line-height:36px;margin:0;min-width:0;overflow-wrap:anywhere}
.blank{display:inline-block;min-width:4.5ch;border-bottom:2px solid var(--pen);text-align:center;line-height:1;padding:0 4px;
  font-family:var(--hand);font-size:1.3em;color:var(--pen)}
.ru{margin:0;color:var(--muted);font-size:.95rem;line-height:36px}

form{display:flex;gap:8px;flex-wrap:wrap}
input{flex:1 1 160px;min-width:0;font:inherit;font-size:1.05rem;padding:11px 12px;border-radius:6px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink)}
button{font:inherit;font-weight:600;padding:11px 16px;border-radius:6px;border:1.5px solid transparent;cursor:pointer}
.primary{background:var(--pen);color:var(--sheet)}
.ghost{background:transparent;color:var(--muted);border-color:var(--line)}
input:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--cover);outline-offset:2px}

.feedback{display:flex;flex-direction:column;gap:6px;background:var(--sheet);padding:2px 0}
.verdict{font-weight:600;margin:0}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.family{margin:0;font-size:.95rem;color:var(--muted)}
.family span{color:var(--ink)}
.next{align-self:flex-start}

.done h2{font-family:var(--display);font-size:1.5rem;margin:0}
.done p{margin:0}

details{border-top:1px solid var(--line);padding-top:14px}
summary{cursor:pointer;font-weight:600}
.sheet{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{text-align:left;padding:7px 10px 7px 0;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.p{font-family:var(--hand);font-size:1.3rem;color:var(--pen);line-height:1.1}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Participios irregulares</h1>
    <p>Впиши причастие в пропуск. Ошибки вернутся в конце круга.</p>
  </header>

  <div class="progress"><span id="count">1 из 20</span><div class="bar"><i id="bar"></i></div></div>

  <section class="card" id="card">
    <div class="verb">глагол<b id="verb"></b></div>
    <p class="sentence" id="sentence"></p>
    <p class="ru" id="ru"></p>
    <form id="form" autocomplete="off">
      <input id="answer" type="text" aria-label="Причастие" placeholder="причастие" autocapitalize="none" autocorrect="off" spellcheck="false">
      <button class="primary" type="submit" id="check">Проверить</button>
      <button class="ghost" type="button" id="skip">Не помню</button>
    </form>
    <div class="feedback" id="feedback" hidden>
      <p class="verdict" id="verdict"></p>
      <p class="family" id="family"></p>
      <button class="primary next" type="button" id="next">Дальше</button>
    </div>
  </section>

  <section class="card done" id="done" hidden>
    <h2>Круг пройден</h2>
    <p id="score"></p>
    <button class="primary next" type="button" id="again">Ещё круг</button>
  </section>

  <details>
    <summary>Шпаргалка по моделям</summary>
    <div class="sheet"><table>
      <thead><tr><th>Модель</th><th>Инфинитив</th><th>Причастие</th></tr></thead>
      <tbody id="cheat"></tbody>
    </table></div>
  </details>
</div>

<script>
const VERBS = [
 {inf:'hacer', p:'hecho', model:'-cho', fam:'deshacer → deshecho, satisfacer → satisfecho',
  s:[['Todavía no he ___ los deberes.','Я ещё не сделал домашнее задание.'],['¿Qué has ___ este fin de semana?','Что ты делал в эти выходные?']]},
 {inf:'decir', p:'dicho', model:'-cho', fam:'predecir → predicho, contradecir → contradicho',
  s:[['Ya te lo he ___ mil veces.','Я тебе это уже тысячу раз говорил.'],['¿Quién te ha ___ eso?','Кто тебе это сказал?']]},
 {inf:'abrir', p:'abierto', model:'-ierto', fam:'reabrir → reabierto, cubrir → cubierto',
  s:[['He ___ la ventana porque hace calor.','Я открыл окно, потому что жарко.'],['Han ___ una panadería nueva en el barrio.','В районе открыли новую пекарню.']]},
 {inf:'descubrir', p:'descubierto', model:'-ierto', fam:'cubrir → cubierto, encubrir → encubierto',
  s:[['Hemos ___ un bar genial cerca de casa.','Мы нашли отличный бар рядом с домом.'],['Los científicos han ___ un planeta nuevo.','Учёные открыли новую планету.']]},
 {inf:'poner', p:'puesto', model:'-uesto', fam:'componer → compuesto, proponer → propuesto, suponer → supuesto',
  s:[['¿Dónde has ___ las llaves?','Куда ты положил ключи?'],['He ___ la mesa para cenar.','Я накрыл стол к ужину.']]},
 {inf:'volver', p:'vuelto', model:'-uelto', fam:'devolver → devuelto, envolver → envuelto, resolver → resuelto',
  s:[['Marta todavía no ha ___ del trabajo.','Марта ещё не вернулась с работы.'],['Hemos ___ a casa muy tarde.','Мы вернулись домой очень поздно.']]},
 {inf:'escribir', p:'escrito', model:'-to', fam:'describir → descrito, inscribir → inscrito',
  s:[['Le he ___ un mensaje a mi madre.','Я написал сообщение маме.'],['¿Has ___ ya el correo?','Ты уже написал письмо?']]},
 {inf:'romper', p:'roto', model:'-to', fam:'формы «rompido» в современном языке нет',
  s:[['¡Se me ha ___ el móvil!','У меня сломался телефон!'],['El niño ha ___ un vaso.','Ребёнок разбил стакан.']]},
 {inf:'ver', p:'visto', model:'-sto', fam:'prever → previsto',
  s:[['¿Has ___ la última película de Almodóvar?','Ты видел последний фильм Альмодовара?'],['Nunca he ___ nieve en Barcelona.','Я никогда не видел снега в Барселоне.']]},
 {inf:'ir', p:'ido', model:'правильное', fam:'это правильное причастие: основа + -ido, как comer → comido',
  s:[['Este verano hemos ___ a la playa.','Этим летом мы ездили на пляж.'],['¿Has ___ alguna vez a Sevilla?','Ты когда-нибудь был в Севилье?']]}
];

const $ = id => document.getElementById(id);
const norm = t => t.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
let queue = [], total = 0, solved = 0, firstTry = 0, current = null, answered = false;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function start(){
  queue = shuffle(VERBS.flatMap(v => v.s.map(([es,ru]) => ({v, es, ru, missed:false}))));
  total = queue.length; solved = 0; firstTry = 0;
  $('done').hidden = true; $('card').hidden = false;
  show();
}

function renderSentence(fill){
  const [a,b] = current.es.split('___');
  const el = $('sentence'); el.textContent = '';
  const blank = document.createElement('span'); blank.className = 'blank';
  blank.textContent = fill || ' ';
  el.append(a, blank, b);
}

function show(){
  if(!queue.length){ finish(); return; }
  current = queue[0]; answered = false;
  $('verb').textContent = current.v.inf;
  $('ru').textContent = current.ru;
  renderSentence('');
  $('form').hidden = false; $('feedback').hidden = true;
  $('answer').value = '';
  $('count').textContent = (solved + 1) + ' из ' + total;
  $('bar').style.width = (solved / total * 100) + '%';
  $('answer').focus({preventScroll:true});
}

function grade(text){
  if(answered) return; answered = true;
  const ok = norm(text) === current.v.p;
  queue.shift();
  renderSentence(current.v.p);
  const v = $('verdict');
  if(ok){
    solved++; if(!current.missed) firstTry++;
    v.className = 'verdict ok'; v.textContent = 'Верно: ' + current.v.inf + ' → ' + current.v.p;
  } else {
    current.missed = true; queue.push(current);
    v.className = 'verdict bad';
    v.textContent = (text.trim() ? 'Не «' + text.trim() + '», а ' : 'Правильно: ') + current.v.p + '. Карточка вернётся в конце.';
  }
  $('family').textContent = '';
  const lead = current.v.fam.includes('→') && current.v.inf !== 'ir' ? 'Так же: ' : 'Заметка: ';
  const sp = document.createElement('span'); sp.textContent = current.v.fam;
  $('family').append(lead, sp);
  $('bar').style.width = (solved / total * 100) + '%';
  $('form').hidden = true; $('feedback').hidden = false;
  $('next').focus({preventScroll:true});
}

function finish(){
  $('card').hidden = true; $('done').hidden = false;
  $('count').textContent = total + ' из ' + total;
  $('bar').style.width = '100%';
  $('score').textContent = 'С первой попытки: ' + firstTry + ' из ' + total + '.';
  $('again').focus({preventScroll:true});
}

$('form').addEventListener('submit', e => { e.preventDefault(); if($('answer').value.trim()) grade($('answer').value); else $('answer').focus(); });
$('skip').addEventListener('click', () => grade(''));
$('next').addEventListener('click', show);
$('again').addEventListener('click', start);

$('cheat').innerHTML = VERBS.map(v => '<tr><td>' + v.model + '</td><td>' + v.inf + '</td><td class="p">' + v.p + '</td></tr>').join('');
start();
</script>
</body>
</html>
